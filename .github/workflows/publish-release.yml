name: Pack and publish

on:
  release:
    types:
      - published

jobs:
  release-nugets:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: |-
      ${{
         contains(github.event.release.tag_name, 'preview') && 'test'
      || contains(github.event.release.tag_name, 'rc')      && 'staging'
      ||                                                       'prod'
      }}
    steps:
      - name: Validate tag
        env:
          REGEX: "${{ github.event.release.prerelease && '^v(\\d+)\\.(\\d+)\\.(\\d+)-(preview|rc)\\.\\d+$' ||
                                                         '^v(\\d+)\\.(\\d+)\\.(\\d+)$' }}"
        run: |
          echo "Validating that the tag is in the correct format"
          echo "${{ github.event.release.tag_name }}" | grep -P $REGEX

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install dotnet8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install deps
        run: |
          dotnet restore
      - name: Extract release notes
        id: extract-notes
        run: |
          {
            echo "Release notes look best on GitHub: ${{ github.event.release.html_url }}"
            echo
            jq -r '.release.body // ""' "$GITHUB_EVENT_PATH"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Build
        run: |
          dotnet build --configuration Release --no-restore -p:Deterministic=true -p:BuildNumber=${{ github.run_number }}
      - name: Pack
        run: |
          dotnet pack --configuration Release --no-restore --no-build -p:Deterministic=true -p:BuildNumber=${{ github.run_number }}
      - name: Versions
        run: |
          dotnet --version
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}
      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push src/**/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
